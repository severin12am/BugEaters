# Fly.io — authoritative race server
# Deploy: fly launch (first time) / fly deploy
# Docs: https://fly.io/docs/

app = "bugeaters-race"
primary_region = "fra"

[build]
  dockerfile = "Dockerfile.race-server"

[env]
  PORT = "2567"
  NODE_ENV = "production"

# Single machine only — Colyseus rooms + /dev/ticket are in-memory (no Redis yet).
# A second machine splits players into different races. After every deploy: fly scale count 1
# Redis presence/driver is the unlock for horizontal scale — see docs/DEPLOY_NOW.md § Redis.
[deploy]
  strategy = "immediate"

[http_service]
  internal_port = 2567
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
  cpus = 1
