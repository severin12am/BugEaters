# Supabase CLI project config. Run `supabase link --project-ref <ref>` then
# `supabase db push` and `supabase functions deploy <name>`.
project_id = "bugeaters"

[functions.telegram-auth]
verify_jwt = false

[functions.join-room]
verify_jwt = true

[functions.referee]
verify_jwt = true

[functions.race-ticket]
verify_jwt = true

[functions.race-results]
verify_jwt = false

# TON wallet + pass NFT loop (see docs/TON_CRYPTO_IMPLEMENTATION_PLAN.md)
[functions.ton-proof-payload]
verify_jwt = true

[functions.link-wallet]
verify_jwt = true

[functions.pass-burn]
verify_jwt = true

[functions.sync-passes]
verify_jwt = true

# Public TEP-64 metadata read by wallets / marketplaces — no JWT.
[functions.nft-meta]
verify_jwt = false
